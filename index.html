<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>図形イメージトレーニングゲーム</title>
<style>
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background-color: #f4f7f6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    color: #333;
    margin: 0;
    box-sizing: border-box;
    touch-action: manipulation;
  }
  h1 { 
    font-size: 28px; 
    color: #4a4a4a; 
    margin-bottom: 10px;
  }

  /* モード切替タブ */
  .tab-container {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .tab-btn {
    font-size: 16px;
    font-weight: bold;
    padding: 10px 20px;
    background-color: #cfd8dc;
    color: #546e7a;
    border: none;
    border-radius: 10px 10px 0 0;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background-color: #fff;
    color: #2e7d32;
    box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
  }

  /* ゲーム画面の切り替え */
  .game-mode {
    display: none;
    flex-direction: column;
    align-items: center;
    background: #fff;
    padding: 30px;
    border-radius: 0 20px 20px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    width: 100%;
    max-width: 1200px;
    box-sizing: border-box;
  }
  .game-mode.active {
    display: flex;
  }

  .controls { margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  select {
    padding: 10px 15px;
    font-size: 16px;
    border-radius: 8px;
    border: 2px solid #ccc;
    cursor: pointer;
    background-color: white;
  }

  /* --- 立方体モードのスタイル --- */
  .cube-layout {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    width: 100%;
  }
  .scene-container {
    width: 1000px;
    height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border-bottom: 5px solid #e0e0e0;
    overflow: hidden;
    background: #fafbfc;
    border-radius: 16px;
  }
  .scene { width: 160px; height: 160px; perspective: 900px; }
  .tilt { width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.6s ease; transform: rotateX(0deg) rotateY(0deg); }
  .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
  .face {
    position: absolute; width: 160px; height: 160px;
    background: rgba(255, 255, 255, 0.95); border: 2px solid #ccc;
    box-sizing: border-box; display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
  }
  .front { border: 4px solid #78909c; transform: rotateY(0deg) translateZ(80px); background: #fff; }
  .right { transform: rotateY(90deg) translateZ(80px); }
  .back { transform: rotateY(180deg) translateZ(80px); }
  .left { transform: rotateY(-90deg) translateZ(80px); }
  .top { transform: rotateX(90deg) translateZ(80px); background: #f0f0f0; }
  .bottom { transform: rotateX(-90deg) translateZ(80px); background: #e0e0e0; }

  .arrow-btn {
    font-size: 32px;
    padding: 20px 15px;
    min-width: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* --- 線対称モードのスタイル --- */
  .symmetry-workspace {
    display: flex;
    width: 620px;
    height: 320px;
    background: #fff;
    border: 3px solid #ccc;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    margin-bottom: 20px;
    perspective: 1200px;
  }
  .sym-half {
    width: 50%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  
  .sym-axis {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 4px;
    background-color: #ff5722;
    z-index: 5;
    transform: translateX(-2px);
    box-shadow: 0 0 10px rgba(255, 87, 34, 0.5);
  }

  .fold-btn-container {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 30;
  }

  .sym-label {
    position: absolute;
    top: 10px;
    font-weight: bold;
    font-size: 14px;
    color: #78909c;
  }
  .content-box {
    width: 240px;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  button {
    font-size: 18px;
    font-weight: bold;
    padding: 15px 25px;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 4px 0px rgba(0,0,0,0.2);
    transition: all 0.1s;
    white-space: nowrap;
  }
  button:active { transform: translateY(4px); box-shadow: 0 0px 0px rgba(0,0,0,0.2); }
  .btn-blue { background-color: #2196F3; box-shadow: 0 4px 0px #1565C0; }
  .btn-green { background-color: #4CAF50; box-shadow: 0 4px 0px #2E7D32; }
  .btn-orange { background-color: #FF9800; box-shadow: 0 4px 0px #F57C00; }
  
  .view-controls {
    display: flex;
    flex-direction: column;
    gap: 15px;
    padding-left: 15px;
    border-left: 2px dashed #ccc;
  }
</style>
</head>
<body>

  <h1>🎲 図形イメージトレーニングゲーム</h1>

  <div class="tab-container">
    <button class="tab-btn active" id="tabCube" onclick="switchMode('cube')">📦 立方体回転モード</button>
    <button class="tab-btn" id="tabSymmetry" onclick="switchMode('symmetry')">🦋 線対称トレーニングモード</button>
  </div>

  <!-- 立方体回転ゲーム モード -->
  <div class="game-mode active" id="modeCube">
    <div class="controls">
      <label for="shapeSelect"><b>前面の模様：</b></label>
      <select id="shapeSelect" onchange="updateCubeShape()">
        <option value="bear" selected>クマの顔</option>
        <option value="triangle">さんかく</option>
        <option value="arrow">上向き矢印</option>
        <option value="f">アルファベット「F」</option>
        <option value="draw">お絵描き 🎨</option>
      </select>
    </div>

    <div class="cube-layout">
      <button class="btn-blue arrow-btn" onclick="rollLeft()">◀</button>
      
      <div class="scene-container">
        <div class="scene">
          <div class="tilt" id="tilt">
            <div class="cube" id="cube">
              <div class="face front" id="frontFace"></div>
              <div class="face back"></div>
              <div class="face right"></div>
              <div class="face left"></div>
              <div class="face top"></div>
              <div class="face bottom"></div>
            </div>
          </div>
        </div>
      </div>

      <button class="btn-green arrow-btn" onclick="rollRight()">▶</button>

      <div class="view-controls">
        <div style="font-size:14px; font-weight:bold; color:#666; text-align:center;">視点きりかえ</div>
        <button id="btnFront" class="btn-orange" style="font-size:14px; padding:10px;" onclick="setView('front')">真正面</button>
        <button id="btnDiagonal" class="btn-blue" style="font-size:14px; padding:10px; background-color:#90A4AE; box-shadow:0 4px 0px #607D8B;" onclick="setView('diagonal')">ななめ</button>
      </div>
    </div>
  </div>

  <!-- 線対称トレーニング モード -->
  <div class="game-mode" id="modeSymmetry">
    <div class="controls">
      <label for="symShapeSelect"><b>左側の模様：</b></label>
      <select id="symShapeSelect" onchange="updateSymShape()">
        <option value="elephant" selected>ぞう（横向き）</option>
        <option value="yacht">ヨット</option>
        <option value="f">アルファベット「F」</option>
        <option value="draw">お絵描き 🎨</option>
      </select>
    </div>

    <div class="symmetry-workspace">
      <div class="sym-axis"></div>

      <div class="fold-btn-container">
        <button id="actionBtn" class="btn-orange" onclick="toggleFold()" style="padding: 12px 24px; font-size:18px; border-radius: 30px;">おる</button>
      </div>

      <div class="sym-half">
        <div class="sym-label">ひだり（もと）</div>
        <div class="content-box" id="symLeftBox"></div>
      </div>

      <div class="sym-half">
        <div class="sym-label">みぎ（線対称）</div>
        <div class="content-box" id="symRightBox"></div>
      </div>

      <div id="flippingLayer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 20;"></div>
    </div>
  </div>

  <!-- お絵描きポップアップ（360px×360pxに拡大） -->
  <div id="drawModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:100; align-items:center; justify-content:center;">
    <div style="background:#fff; padding:25px; border-radius:20px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.2); max-width: 90vw;">
      <h3 style="margin-top:0; margin-bottom:15px; font-size:20px;">お絵描きキャンバス（画用紙）</h3>
      <!-- 画用紙サイズを360x360へ大型化 -->
      <canvas id="drawCanvas" width="360" height="360" style="border:3px dashed #bbb; background:#fff; cursor:crosshair; border-radius:12px; display:block; margin:0 auto 20px auto; touch-action: none;"></canvas>
      <div style="display:flex; justify-content:center; gap:20px;">
        <button onclick="clearCanvas()" style="background-color: #E53935; box-shadow: 0 4px 0px #B71C1C; font-size:16px; padding:12px 24px;">けす</button>
        <button onclick="applyDrawing()" style="background-color: #43A047; box-shadow: 0 4px 0px #1B5E20; font-size:16px; padding:12px 24px;">これで決まり！</button>
      </div>
    </div>
  </div>

  <script>
    function switchMode(mode) {
      document.getElementById('tabCube').classList.toggle('active', mode === 'cube');
      document.getElementById('tabSymmetry').classList.toggle('active', mode === 'symmetry');
      document.getElementById('modeCube').classList.toggle('active', mode === 'cube');
      document.getElementById('modeSymmetry').classList.toggle('active', mode === 'symmetry');
      if (mode === 'symmetry') initSymmetry();
    }

    const shapeData = {
      bear: `<svg width="140" height="140" viewBox="0 0 100 100"><circle cx="25" cy="25" r="15" fill="#8D6E63"/><circle cx="75" cy="25" r="15" fill="#8D6E63"/><circle cx="50" cy="55" r="40" fill="#A1887F"/><circle cx="35" cy="45" r="5" fill="#3E2723"/><circle cx="65" cy="45" r="5" fill="#3E2723"/><ellipse cx="50" cy="65" rx="18" ry="14" fill="#D7CCC8"/><circle cx="50" cy="60" r="5" fill="#3E2723"/><path d="M 50 65 Q 50 75 42 72 M 50 65 Q 50 75 58 72" fill="none" stroke="#3E2723" stroke-width="2"/></svg>`,
      triangle: `<svg width="140" height="140" viewBox="0 0 100 100"><polygon points="50,15 15,85 85,85" fill="#FF7043" stroke="#D84315" stroke-width="4" stroke-linejoin="round"/></svg>`,
      arrow: `<svg width="140" height="140" viewBox="0 0 100 100"><polygon points="50,15 85,50 65,50 65,85 35,85 35,50 15,50" fill="#42A5F5" stroke="#1E88E5" stroke-width="4" stroke-linejoin="round"/></svg>`,
      f: `<svg width="140" height="140" viewBox="0 0 100 100"><rect x="25" y="15" width="20" height="70" fill="#9C27B0" rx="2"/><rect x="45" y="15" width="35" height="20" fill="#9C27B0" rx="2"/><rect x="45" y="45" width="25" height="20" fill="#9C27B0" rx="2"/></svg>`,
      elephant: `<svg width="150" height="150" viewBox="0 0 100 100">
                  <ellipse cx="45" cy="55" rx="25" ry="20" fill="#90A4AE"/>
                  <circle cx="60" cy="45" r="16" fill="#90A4AE"/>
                  <ellipse cx="48" cy="42" rx="10" ry="14" fill="#78909C"/>
                  <path d="M 72 48 Q 92 50 86 30 Q 84 22 78 25" fill="none" stroke="#90A4AE" stroke-width="7" stroke-linecap="round"/>
                  <circle cx="65" cy="40" r="2.5" fill="#263238"/>
                  <path d="M 70 52 Q 78 55 75 46" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
                  <rect x="30" y="70" width="8" height="15" fill="#78909C" rx="3"/>
                  <rect x="48" y="70" width="8" height="15" fill="#78909C" rx="3"/>
                  <path d="M 20 52 Q 12 58 14 66" fill="none" stroke="#78909C" stroke-width="3" stroke-linecap="round"/>
                </svg>`,
      yacht: `<svg width="150" height="150" viewBox="0 0 100 100">
               <polygon points="15,70 85,70 75,88 25,88" fill="#8D6E63" stroke="#5D4037" stroke-width="3" stroke-linejoin="round"/>
               <line x1="38" y1="12" x2="38" y2="70" stroke="#4E342E" stroke-width="4" stroke-linecap="round"/>
               <polygon points="42,16 88,62 42,62" fill="#FF5252"/>
               <polygon points="38,12 22,18 38,24" fill="#FFD54F"/>
             </svg>`
    };

    // --- お絵描き機能（マウス＆タッチ両対応） ---
    let targetMode = 'cube';
    const drawModal = document.getElementById('drawModal');
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#333';

    // マウス/タッチ共通の座標取得処理
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function startDrawing(e) {
      if (e.type === 'touchstart') e.preventDefault(); // タブレットのスクロール防止
      isDrawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      if (e.type === 'touchmove') e.preventDefault(); // タブレットのスクロール防止
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      isDrawing = false;
    }

    // マウスイベント
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    // タッチイベント（タブレット・スマホ対応）
    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDrawing);

    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
    function openDrawModal(mode) { targetMode = mode; clearCanvas(); drawModal.style.display = 'flex'; }

    function applyDrawing() {
      const dataURL = canvas.toDataURL();
      drawModal.style.display = 'none';
      if (targetMode === 'cube') {
        const frontFace = document.getElementById('frontFace');
        frontFace.innerHTML = '';
        frontFace.style.backgroundImage = `url(${dataURL})`;
        frontFace.style.backgroundSize = 'cover';
      } else {
        symCustomImage = dataURL;
        updateSymShape();
      }
    }

    // ==========================================
    // 📦 立方体回転モード
    // ==========================================
    let currentAngle = 0;
    let currentX = 0; 
    const cubeSize = 160; 
    const maxLimit = 480; 

    const cube = document.getElementById('cube');
    const tilt = document.getElementById('tilt');
    const frontFace = document.getElementById('frontFace');
    const shapeSelect = document.getElementById('shapeSelect');
    const btnFront = document.getElementById('btnFront');
    const btnDiagonal = document.getElementById('btnDiagonal');

    function updateCubeShape() {
      const val = shapeSelect.value;
      if (val === 'draw') {
        openDrawModal('cube');
      } else {
        frontFace.style.backgroundImage = 'none';
        frontFace.innerHTML = shapeData[val];
      }
    }

    function applyTransform() {
      cube.style.transform = `translateX(${currentX}px) rotateZ(${currentAngle}deg)`;
    }

    function rollRight() {
      currentAngle += 90;
      currentX += cubeSize;
      if (currentX > maxLimit) {
        setTimeout(() => {
          cube.style.transition = 'none';
          currentX = 0;
          applyTransform();
          setTimeout(() => { cube.style.transition = 'transform 1.2s cubic-bezier(0.4, 0, 0.2, 1)'; }, 50);
        }, 1200);
      }
      applyTransform();
    }

    function rollLeft() {
      currentAngle -= 90;
      currentX -= cubeSize;
      if (currentX < -maxLimit) {
        setTimeout(() => {
          cube.style.transition = 'none';
          currentX = 0;
          applyTransform();
          setTimeout(() => { cube.style.transition = 'transform 1.2s cubic-bezier(0.4, 0, 0.2, 1)'; }, 50);
        }, 1200);
      }
      applyTransform();
    }

    function setView(viewType) {
      if (viewType === 'front') {
        tilt.style.transform = 'rotateX(0deg) rotateY(0deg)';
        btnFront.style.backgroundColor = '#FF9800';
        btnDiagonal.style.backgroundColor = '#90A4AE';
      } else {
        tilt.style.transform = 'rotateX(-15deg) rotateY(-25deg)';
        btnDiagonal.style.backgroundColor = '#FF9800';
        btnFront.style.backgroundColor = '#90A4AE';
      }
    }

    // ==========================================
    // 🦋 線対称トレーニングモード
    // ==========================================
    let symCustomImage = null;
    let isFolded = false;
    let isAnimating = false;

    function initSymmetry() {
      updateSymShape();
      resetSymmetry();
    }

    function updateSymShape() {
      const val = document.getElementById('symShapeSelect').value;
      const leftBox = document.getElementById('symLeftBox');
      if (val === 'draw') {
        if (!symCustomImage) {
          openDrawModal('symmetry');
          return;
        }
        leftBox.innerHTML = `<img src="${symCustomImage}" style="width:140px; height:140px; object-fit:contain;">`;
      } else {
        symCustomImage = null;
        leftBox.innerHTML = shapeData[val];
      }
      resetSymmetry();
    }

    document.getElementById('symShapeSelect').addEventListener('change', function(e) {
      if (e.target.value === 'draw') {
        openDrawModal('symmetry');
      }
    });

    function resetSymmetry() {
      isFolded = false;
      isAnimating = false;
      document.getElementById('flippingLayer').innerHTML = '';
      const actionBtn = document.getElementById('actionBtn');
      actionBtn.innerText = 'おる';
      actionBtn.style.backgroundColor = '#FF9800';
      actionBtn.style.boxShadow = '0 4px 0px #F57C00';
    }

    function toggleFold() {
      if (isAnimating) return;

      const actionBtn = document.getElementById('actionBtn');

      if (!isFolded) {
        isAnimating = true;
        isFolded = true;

        actionBtn.innerText = 'もどす';
        actionBtn.style.backgroundColor = '#2196F3';
        actionBtn.style.boxShadow = '0 4px 0px #1565C0';

        const leftBox = document.getElementById('symLeftBox');
        const workspace = document.querySelector('.symmetry-workspace');
        const workspaceRect = workspace.getBoundingClientRect();
        const leftRect = leftBox.getBoundingClientRect();

        const axisX = workspaceRect.width / 2;
        const startLeft = leftRect.left - workspaceRect.left;
        const cardWidth = axisX - startLeft;
        const boxHeight = leftRect.height;
        const boxTop = leftRect.top - workspaceRect.top;

        const layer = document.getElementById('flippingLayer');
        const card = document.createElement('div');
        card.id = 'activeFoldCard';
        
        card.style.position = 'absolute';
        card.style.left = startLeft + 'px';
        card.style.top = boxTop + 'px';
        card.style.width = cardWidth + 'px';
        card.style.height = boxHeight + 'px';
        card.style.transformOrigin = 'right center';
        card.style.transformStyle = 'preserve-3d';
        card.style.transition = 'transform 3.0s cubic-bezier(0.25, 1, 0.3, 1)';

        card.innerHTML = `
          <div style="position:absolute; width:100%; height:100%; backface-visibility:hidden; display:flex; align-items:center; justify-content:flex-start;">
            <div style="width:${leftRect.width}px; height:${leftRect.height}px; display:flex; align-items:center; justify-content:center;">
              ${leftBox.innerHTML}
            </div>
          </div>
          <div style="position:absolute; width:100%; height:100%; backface-visibility:hidden; display:flex; align-items:center; justify-content:flex-start; transform: rotateY(180deg) scaleX(-1);">
            <div style="width:${leftRect.width}px; height:${leftRect.height}px; display:flex; align-items:center; justify-content:center;">
              ${leftBox.innerHTML}
            </div>
          </div>
        `;

        layer.appendChild(card);

        setTimeout(() => {
          card.style.transform = 'rotateY(180deg)';
        }, 50);

        setTimeout(() => {
          isAnimating = false;
        }, 3050);

      } else {
        isAnimating = true;
        const card = document.getElementById('activeFoldCard');

        if (card) {
          card.style.transform = 'rotateY(0deg)';
        }

        actionBtn.innerText = 'おる';
        actionBtn.style.backgroundColor = '#FF9800';
        actionBtn.style.boxShadow = '0 4px 0px #F57C00';

        setTimeout(() => {
          resetSymmetry();
        }, 3000);
      }
    }

    // 初期化
    updateCubeShape();
  </script>
</body>
</html>
